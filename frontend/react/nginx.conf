# Servidor da tela em produção. ${API_UPSTREAM} é preenchido na subida pela imagem oficial do nginx
# (só variáveis de ambiente que existem são trocadas; $host, $uri etc. continuam do nginx).
server {
  listen 8080;
  server_name _;
  root /usr/share/nginx/html;
  index index.html;

  gzip on;
  gzip_types text/css application/javascript application/json image/svg+xml text/plain;
  gzip_min_length 1024;

  add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;
  add_header X-Content-Type-Options "nosniff" always;
  add_header Referrer-Policy "strict-origin-when-cross-origin" always;
  add_header Content-Security-Policy "frame-ancestors 'none'" always;

  # DNS interno do Docker: o endereço da API é consultado de novo a cada 10 s,
  # então reiniciar só a API não deixa a tela com 502.
  resolver 127.0.0.11 valid=10s ipv6=off;
  set $api_upstream ${API_UPSTREAM};

  location = /nginx-health {
    access_log off;
    default_type text/plain;
    return 200 "ok";
  }

  location /api/ {
    proxy_pass $api_upstream;
    proxy_set_header Host $host;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $http_x_forwarded_proto;
    proxy_read_timeout 120s;
  }

  location /health {
    proxy_pass $api_upstream;
  }

  # Arquivos com hash no nome: cache longo.
  location /assets/ {
    expires 1y;
    add_header Cache-Control "public, immutable";
    add_header X-Content-Type-Options "nosniff" always;
    try_files $uri =404;
  }

  # index.html nunca em cache, para a nova versão aparecer logo.
  location / {
    add_header Cache-Control "no-cache";
    add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    add_header Content-Security-Policy "frame-ancestors 'none'" always;
    try_files $uri /index.html;
  }
}
