# Produção (Coolify): tela (pública, com HTTPS do Coolify), API e banco, tudo neste arquivo.
# O banco não publica porta: só a API o alcança, pela rede interna. Sem Mailpit.
# Guia: infrastructure/docker/COOLIFY.md
services:
  postgres:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: radar
      # Gerada pelo Coolify (variável mágica SERVICE_PASSWORD_*): nenhum segredo no Git.
      POSTGRES_PASSWORD: ${SERVICE_PASSWORD_POSTGRES}
      POSTGRES_DB: radar
      POSTGRES_INITDB_ARGS: "--encoding=UTF8 --locale=C.UTF-8"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U radar -d radar"]
      interval: 5s
      timeout: 5s
      retries: 10

  api:
    build:
      context: ./backend/node
      target: runtime
    restart: unless-stopped
    environment:
      NODE_ENV: production
      PORT: 4000
      DATABASE_URL: postgresql://radar:${SERVICE_PASSWORD_POSTGRES}@postgres:5432/radar
      APP_BASE_URL: ${APP_BASE_URL:?defina APP_BASE_URL (https://...)}
      COOKIE_SECURE: "true"
      # Coolify (proxy) + nginx da tela = 2 saltos até a API.
      TRUST_PROXY: ${TRUST_PROXY:-2}
      # E-mail: sem MAIL_USER/MAIL_PASSWORD a API só sobe com ALLOW_PRODUCTION_WITHOUT_MAIL=true.
      ALLOW_PRODUCTION_WITHOUT_MAIL: ${ALLOW_PRODUCTION_WITHOUT_MAIL:-false}
      MAIL_HOST: ${MAIL_HOST:-}
      MAIL_PORT: ${MAIL_PORT:-587}
      MAIL_USER: ${MAIL_USER:-}
      MAIL_PASSWORD: ${MAIL_PASSWORD:-}
      MAIL_SECURE: ${MAIL_SECURE:-}
      MAIL_FROM: ${MAIL_FROM:-Farmarcas <nao-responda@farmarcas.com.br>}
      ADMIN_API_KEY: ${ADMIN_API_KEY:?defina ADMIN_API_KEY}
      # Análise com IA (opcional): vazio deixa o assistente desligado.
      ANTHROPIC_API_KEY: ${ANTHROPIC_API_KEY:-}
      ASSISTANT_MODEL: ${ASSISTANT_MODEL:-claude-sonnet-5-5}
      ASSISTANT_EFFORT: ${ASSISTANT_EFFORT:-medium}
    depends_on:
      postgres:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://127.0.0.1:4000/health/ready >/dev/null || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 90s

  web:
    build:
      context: ./frontend/react
      target: runtime
    restart: unless-stopped
    environment:
      API_UPSTREAM: http://api:4000
    expose:
      - "8080"
    depends_on:
      api:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://127.0.0.1:8080/nginx-health >/dev/null || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 10

volumes:
  postgres_data:
